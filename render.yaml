services:
  - type: web
    name: cedar-coal-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: REASONING_EFFORT
        value: medium
      - key: GROQ_API_KEY
        sync: false
